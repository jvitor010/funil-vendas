<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico do Sono - CJO</title>
    <!-- DNS Prefetch & Preconnect (Performance) -->
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://unpkg.com">
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <!-- Prefetch next page -->
    <link rel="prefetch" href="sales.html">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #fdfaf6;
            background-image: radial-gradient(circle at 15% 50%, rgba(255, 230, 200, 0.4), transparent 30%),
                              radial-gradient(circle at 85% 30%, rgba(250, 220, 190, 0.4), transparent 30%),
                              radial-gradient(circle at 50% 80%, rgba(245, 240, 235, 0.5), transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-btn {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.08);
            border-color: #eab308; /* Tailwind Yellow 500 */
        }
        
        .option-btn:active {
            transform: translateY(0);
        }

        .letter-box {
            transition: all 0.25s;
        }
        
        .option-btn:hover .letter-box {
            background-color: #fef08a; /* Yellow 200 */
            color: #854d0e; /* Yellow 800 */
        }

        .loading-bar {
            background-size: 200% 100%;
            background-image: linear-gradient(90deg, #1f2937 0%, #4b5563 50%, #1f2937 100%);
            animation: loadProgress infinite 1.5s ease-in-out;
        }

        @keyframes loadProgress {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes fillUp {
            from { width: 0%; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const quizData = [
            {
                id: 1,
                title: "O que mais atrapalha o sono do seu bebê hoje?",
                image: "assets/quiz_intro.png", 
                options: [
                    "Demora muito para dormir chorando",
                    "Acorda várias vezes de madrugada",
                    "Só dorme no colo ou no peito (associação forte)",
                    "Acorda muito cedo e não volta a dormir"
                ]
            },
            {
                id: 2,
                title: "Qual a idade exata do seu bebê?",
                image: "assets/quiz_ages.png", 
                options: [
                    "0 a 3 meses (Fase da Extero-Gestação)",
                    "4 a 6 meses (Pico de Salto de Desenvolvimento)",
                    "7 a 12 meses (Angústia de Separação Média)",
                    "Mais de 1 ano"
                ]
            },
            {
                id: 3,
                preTitle: "A maioria das mães relata exaustão física por causa das múltiplas interrupções de madrugada. Como é a sua realidade hoje?",
                title: "Quantas vezes o bebê costuma acordar por noite?",
                image: "assets/quiz_struggle.png",
                options: [
                    "1 a 2 vezes (É cansativo, mas eu controlo)",
                    "3 a 4 vezes (Estou começando a não aguentar o cansaço)",
                    "5 a 8 vezes (Estou no meu limite absoluto de privação)",
                    "Acorda de hora em hora (É um pesadelo, preciso de ajuda urgente)"
                ]
            },
            {
                id: 4,
                preTitle: "Associações de sono são o maior inimigo da previsibilidade em longo prazo.",
                title: "Como seu bebê normalmente consegue adormecer à noite?",
                image: "assets/quiz_association.png",
                options: [
                    "Precisa estar no colo, andando ou sendo embalado",
                    "Precisa mamar (peito ou mamadeira) até 'apagar'",
                    "Dorme no colo, mas acorda assustado ao tocar no berço",
                    "Dorme sozinho, mas a madrugada ainda é ruim"
                ]
            },
            {
                id: 5,
                preTitle: "Com o amadurecimento cerebral, a biologia muda.",
                title: "Você já sabe aplicar o modelo neurobiológico das 'Janelas de Sono' ajustadas à idade?",
                image: "assets/quiz_sleep_windows.png",
                options: [
                    "Nunca ouvi falar nisso",
                    "Já ouvi falar, mas não consigo acertar a hora",
                    "Tento aplicar, mas parece que pra mim nada dá certo",
                    "Sim, estudo sobre, mas continuo errando na prática"
                ]
            },
            {
                id: 6,
                preTitle: "A solução para o fim das madrugadas caóticas.",
                title: "Se pudéssemos te entregar o 'Código Biológico' exato da sua criança, para ela aceitar dormir sem choro, você usaria?",
                image: "assets/quiz_solution.png",
                options: [
                    "Sim, preciso disso imediatamente!",
                    "Com certeza, minha saúde depende disso hoje",
                    "Talvez, preciso ver como funciona",
                    "Não, pretendo continuar do mesmo jeito"
                ]
            }
        ];

        const letters = ['A', 'B', 'C', 'D'];

        function QuizApp() {
            const [currentStep, setCurrentStep] = useState(0);
            const [isLoading, setIsLoading] = useState(false);
            const [loadingText, setLoadingText] = useState("Analisando padrões biológicos...");
            const [showResult, setShowResult] = useState(false);

            const handleAnswer = () => {
                if (currentStep < quizData.length - 1) {
                    setCurrentStep(prev => prev + 1);
                } else {
                    startLoadingSequence();
                }
            };

            const startLoadingSequence = () => {
                setIsLoading(true);
                
                const steps = [
                    "Analisando padrões biológicos informados...",
                    "Mapeando o ciclo circadiano correspondente à idade...",
                    "Encontrando falhas críticas nas Janelas de Sono...",
                    "Montando o seu diagnóstico personalizado CJO..."
                ];
                
                let i = 0;
                const interval = setInterval(() => {
                    i++;
                    if (i < steps.length) {
                        setLoadingText(steps[i]);
                    } else {
                        clearInterval(interval);
                        setIsLoading(false);
                        setShowResult(true);
                    }
                }, 1800);
            };

            const renderProgressBar = () => {
                const progress = ((currentStep) / quizData.length) * 100;
                return (
                    <div className="mt-6 mb-8 max-w-[320px] mx-auto">
                        <p className="text-center text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Pergunta {currentStep + 1} de {quizData.length}</p>
                        <div className="w-full bg-gray-200/80 h-1.5 rounded-full overflow-hidden backdrop-blur-sm shadow-inner">
                            <div 
                                className="bg-gray-800 h-full rounded-full transition-all duration-700 ease-out"
                                style={{ width: `${progress}%` }}
                            ></div>
                        </div>
                    </div>
                );
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center max-w-lg mx-auto fade-in">
                        <div className="w-20 h-20 mb-8 rounded-full border-4 border-gray-200 border-t-yellow-500 animate-spin shadow-lg"></div>
                        <h2 className="text-2xl font-bold text-gray-800 mb-2 font-Montserrat">Estamos analisando as respostas do seu diagnóstico de sono...</h2>
                        <p className="text-gray-500 text-sm mb-8">Identificando possíveis fatores que podem estar atrapalhando o sono do seu bebê.</p>
                        
                        {/* Barra de progresso */}
                        <div className="w-full max-w-[340px] mb-2">
                            <div className="flex justify-between items-center mb-1.5">
                                <span className="text-gray-500 text-sm font-semibold">Carregando...</span>
                                <span className="text-gray-500 text-sm font-semibold" id="loadPercent"></span>
                            </div>
                            <div className="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden shadow-inner">
                                <div className="h-full rounded-full loading-bar w-full" style={{animation: 'fillUp 7.2s linear forwards'}}></div>
                            </div>
                        </div>

                        <p className="text-gray-500 font-medium mb-8 min-h-[24px] text-sm mt-3">{loadingText}</p>

                        {/* Depoimentos */}
                        <div className="w-full space-y-3 mt-2">
                            <div className="bg-white rounded-xl p-4 text-left border border-gray-100 shadow-sm">
                                <div className="flex gap-0.5 mb-2">
                                    <span className="text-yellow-400 text-sm">★</span>
                                    <span className="text-yellow-400 text-sm">★</span>
                                    <span className="text-yellow-400 text-sm">★</span>
                                    <span className="text-yellow-400 text-sm">★</span>
                                    <span className="text-yellow-400 text-sm">★</span>
                                </div>
                                <p className="font-bold text-gray-800 text-sm">Juliana Mendes</p>
                                <p className="text-gray-400 text-xs mb-2">@ju.mendes_</p>
                                <p className="text-gray-600 text-sm leading-relaxed">Minha filha dormia só no peito e eu estava destruída. Em 5 dias ela já dormia no berço sozinha. Mudou minha vida!</p>
                            </div>
                            <div className="bg-white rounded-xl p-4 text-left border border-gray-100 shadow-sm">
                                <div className="flex gap-0.5 mb-2">
                                    <span className="text-yellow-400 text-sm">★</span>
                                    <span className="text-yellow-400 text-sm">★</span>
                                    <span className="text-yellow-400 text-sm">★</span>
                                    <span className="text-yellow-400 text-sm">★</span>
                                    <span className="text-yellow-400 text-sm">★</span>
                                </div>
                                <p className="font-bold text-gray-800 text-sm">Tatiane Oliveira</p>
                                <p className="text-gray-400 text-xs mb-2">@tati.oliveira</p>
                                <p className="text-gray-600 text-sm leading-relaxed">Achei que era mais um método milagroso, mas realmente funciona. Meu bebê de 4 meses dorme 10h seguidas agora.</p>
                            </div>
                        </div>
                    </div>
                );
            }

            if (showResult) {
                return (
                    <div className="min-h-screen flex flex-col items-center pt-8 pb-20 px-4 max-w-2xl mx-auto fade-in">
                        
                        <div className="flex flex-col items-center justify-center mb-6">
                            <div className="bg-yellow-100 text-yellow-600 rounded-full w-16 h-16 flex items-center justify-center mb-4 shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
                                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                </svg>
                            </div>
                            <h2 className="text-3xl sm:text-4xl font-extrabold text-[#1a1a1a] text-center leading-tight">
                                Identificamos um erro crucial na rotina do seu bebê
                            </h2>
                        </div>

                        <p className="text-gray-600 text-center text-lg mb-8 max-w-lg font-medium">
                            Isso explica exatamente por que ele briga com o <span className="font-bold text-gray-900 border-b-2 border-yellow-400">SONO</span> e acorda exausto várias vezes à noite...
                        </p>

                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 w-full max-w-md mb-8">
                            <p className="text-gray-800 font-bold text-center mb-4 text-lg">
                                Se isso não for corrigido agora, a tendência é piorar:
                            </p>
                            <ul className="space-y-4 text-gray-700 font-medium w-full">
                                <li className="flex items-center gap-3">
                                    <div className="w-6 h-6 rounded-full bg-red-100 text-red-500 flex items-center justify-center shrink-0">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </div>
                                    <span>Noites cada vez mais <span className="font-bold text-red-500">CANSATIVAS</span></span>
                                </li>
                                <li className="flex items-center gap-3">
                                    <div className="w-6 h-6 rounded-full bg-red-100 text-red-500 flex items-center justify-center shrink-0">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </div>
                                    <span>Bebê <span className="font-bold uppercase text-red-500">Irritado</span> e dependente de colo</span>
                                </li>
                                <li className="flex items-center gap-3">
                                    <div className="w-6 h-6 rounded-full bg-red-100 text-red-500 flex items-center justify-center shrink-0">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </div>
                                    <span>Você <span className="font-bold uppercase text-red-500">Exausta</span> e sem energia</span>
                                </li>
                            </ul>
                        </div>

                        <p className="text-gray-600 text-center mb-8 max-w-lg leading-relaxed text-lg">
                            A boa notícia é que isso tem solução simples! Quando você entende como aplicar o <strong className="text-yellow-600">Código das Janelas de Ouro</strong>.
                        </p>

                        <h3 className="text-[#15803d] font-bold text-2xl text-center mb-10 max-w-lg px-2 leading-snug">
                            Temos a Solução que mostra exatamente o que ajustar na rotina para fazer ele dormir sozinho a noite toda!
                        </h3>

                        {/* MOCKUP DO EBOOK */}
                        <div className="relative w-full max-w-[240px] mx-auto mb-10 group cursor-pointer transition-transform duration-500 hover:scale-105">
                            <img src="assets/capa_ebook.png" alt="Código das Janelas de Ouro" className="w-full rounded-2xl shadow-[0_20px_60px_rgba(0,0,0,0.3)] object-contain border border-white/10" />
                        </div>

                        {/* PREÇO + GARANTIA (gera urgência antes do clique) */}
                        <div className="bg-white/80 backdrop-blur-sm border border-gray-200 rounded-2xl p-5 mb-6 w-full max-w-md text-center shadow-sm">
                            <p className="text-gray-400 text-sm line-through">De R$ 97,00</p>
                            <p className="text-3xl font-black text-[#22c55e] leading-none my-1">R$ 27,00</p>
                            <p className="text-gray-500 text-xs font-medium">Garantia incondicional de 7 dias</p>
                        </div>

                        {/* BOTAO PARA VSL/VENDAS */}
                        <a href="sales.html" className="w-full max-w-md bg-[#22c55e] hover:bg-[#16a34a] text-white font-extrabold text-xl py-5 px-8 rounded-full shadow-[0_8px_30px_rgb(34,197,94,0.3)] hover:shadow-[0_8px_30px_rgb(34,197,94,0.5)] transition-all text-center uppercase tracking-wide flex justify-center items-center gap-3">
                            Liberar meu Acesso CJO
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                        </a>
                        <p className="text-sm font-medium text-gray-400 mt-4 flex items-center justify-center gap-2">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            Acesso seguro e instantâneo · Menos de 2 minutos
                        </p>

                    </div>
                );
            }

            const currentData = quizData[currentStep];

            return (
                <div className="min-h-screen flex flex-col max-w-3xl mx-auto px-4 sm:px-6 pt-4 pb-20 relative">
                    
                    {/* Botão Voltar */}
                    {currentStep > 0 && (
                        <button 
                            onClick={() => setCurrentStep(prev => prev - 1)}
                            className="absolute top-4 left-4 sm:left-6 text-gray-400 hover:text-gray-800 transition-colors bg-white/50 backdrop-blur rounded-full p-2 shadow-sm"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                        </button>
                    )}

                    {renderProgressBar()}

                    <div className="flex flex-col items-center w-full mt-2 sm:mt-6 fade-in" key={currentStep}>
                        
                        {/* Pre-title */}
                        {currentData.preTitle && (
                            <p className="text-center text-sm sm:text-base text-gray-500 font-medium mb-3 max-w-2xl px-2">
                                {currentData.preTitle}
                            </p>
                        )}

                        {/* Title */}
                        <h1 className="text-2xl sm:text-[32px] font-bold text-gray-800 text-center mb-10 px-2 leading-tight tracking-tight">
                            {currentData.title}
                        </h1>

                        {/* Image */}
                        {currentData.image && (
                            <div className="w-full max-w-[500px] mb-8 rounded-[20px] overflow-hidden shadow-lg border border-white/40 ring-4 ring-white/20">
                                <img src={currentData.image} alt={currentData.title} className="w-full h-auto object-cover max-h-[260px] sm:max-h-[320px] hover:scale-105 transition-transform duration-700" />
                            </div>
                        )}

                        {/* Options */}
                        <div className="w-full max-w-[500px] flex flex-col gap-3 sm:gap-4">
                            {currentData.options.map((option, index) => (
                                <button
                                    key={index}
                                    onClick={handleAnswer}
                                    className="option-btn group w-full bg-white/80 backdrop-blur-sm border-2 border-white shadow-[0_4px_12px_rgba(0,0,0,0.03)] rounded-2xl p-3 sm:p-4 focus:outline-none flex items-center justify-start gap-4"
                                >
                                    <div className="letter-box w-10 h-10 sm:w-12 sm:h-12 shrink-0 bg-gray-100/80 text-gray-500 font-bold text-base sm:text-lg rounded-xl flex items-center justify-center border border-gray-200/50 shadow-sm">
                                        {letters[index]}
                                    </div>
                                    <div className="text-left text-gray-700 font-semibold text-[15px] sm:text-[17px] leading-snug pr-2 group-hover:text-gray-900 transition-colors">
                                        {option}
                                    </div>
                                    
                                    {/* Seta Sutil no final para induzir o clique */}
                                    <div className="ml-auto text-gray-300 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                                    </div>
                                </button>
                            ))}
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<QuizApp />);
    </script>
    <!-- Anti-Spy Shield -->
    <script src="./assets/shield.js" defer></script>
</body>
</html>
